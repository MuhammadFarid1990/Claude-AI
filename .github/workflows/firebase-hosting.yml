# Deploys the app to Firebase Hosting on every push to the app branch.
# Needs two repository settings (GitHub → Settings → Secrets and variables → Actions):
#   secret   FIREBASE_SERVICE_ACCOUNT  – the JSON key of a Firebase service account
#   variable FIREBASE_PROJECT_ID       – your Firebase project ID (e.g. bloom-app-12345)
name: Deploy to Firebase Hosting
on:
  push:
    branches: [claude/build-new-app-mBkiR]
  workflow_dispatch:
jobs:
  deploy:
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
