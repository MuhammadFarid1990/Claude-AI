# Deploys the app to Firebase Hosting (bloom-cc7c4) on every push to the app branch.
# Uses the Firebase Admin SDK service account key stored in this repo as the secret
# FIREBASE_SERVICE_ACCOUNT_BLOOM_CC7C4 (Firebase console → Project settings → Service accounts).
name: Deploy to Firebase Hosting
on:
  push:
    branches: [claude/build-new-app-mBkiR]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Firebase key is set up
        id: key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BLOOM_CC7C4 }}
        run: |
          if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Firebase key not set up yet; skipping deploy."; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.key.outputs.ok == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BLOOM_CC7C4 }}
          projectId: bloom-cc7c4
          channelId: live
