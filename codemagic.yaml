workflows:

  # ─────────────────────────────────────────────────────────────────
  # iOS — builds signed IPA and submits to TestFlight
  # ─────────────────────────────────────────────────────────────────
  ios-release:
    name: Bloom iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bloomapp.mobile
      vars:
        BUNDLE_ID: com.bloomapp.mobile
        APP_NAME: Bloom
      node: 20.x
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: claude/build-new-app-mBkiR
          include: true

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $CM_BUILD_NUMBER
          agvtool new-marketing-version 1.0.$CM_BUILD_NUMBER

      - name: Build IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - muhammadfarid3872@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────────────────────────
  # Android — builds signed AAB and uploads to Play Store (internal)
  # ─────────────────────────────────────────────────────────────────
  android-release:
    name: Bloom Android Release
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      vars:
        PACKAGE_NAME: com.bloomapp.mobile
        # Keystore values — add these in Codemagic UI → Environment Variables
        # CM_KEYSTORE:          (paste contents of bloom-release.keystore.b64)
        # CM_KEYSTORE_PASSWORD: (your keystore password)
        # CM_KEY_ALIAS:         bloom
        # CM_KEY_PASSWORD:      (your key password)
      node: 20.x
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: claude/build-new-app-mBkiR
          include: true

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Capacitor sync
        script: npx cap sync android

      - name: Write keystore from env
        script: |
          echo $CM_KEYSTORE | base64 --decode > android/bloom-release.keystore
          cat > android/app/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=../bloom-release.keystore
          EOF

      - name: Set version code
        script: |
          cd android
          sed -i "s/versionCode .*/versionCode $CM_BUILD_NUMBER/" app/build.gradle

      - name: Build signed AAB
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
      email:
        recipients:
          - muhammadfarid3872@gmail.com
        notify:
          success: true
          failure: true
